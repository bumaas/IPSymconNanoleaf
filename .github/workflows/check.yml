name: Checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: PHP-Syntax
        run: find . -name '*.php' -not -path './tests/stubs/*' -print0 | xargs -0 -n1 php -l
      - name: JSON-Validität
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 |
            xargs -0 -n1 php -r 'json_decode(file_get_contents($argv[1]), false, 512, JSON_THROW_ON_ERROR);' --
      - name: Laufzeit-Checks
        run: for t in tests/check-*.php; do echo "== $t"; php "$t" || exit 1; done
